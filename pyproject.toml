[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemalink-engine"
version = "0.1.0"
description = "Schema-guided information extraction from biomedical text using Large Language Models"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ali Rastegar", email = "4lirastegar4li@gmail.com" }
]
keywords = [
    "biomedical", "information extraction", "knowledge graph",
    "linkml", "ontology", "nlp", "llm", "openai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "networkx>=3.1,<3.5",
    "numpy>=1.20.0,<2.0.0",
    "httpx>=0.28.0",
    "requests>=2.31.0",
    "oaklib>=0.5.0",
    "tqdm>=4.67.0",
    "pydantic>=2.11.0",
    "Flask>=2.3.0",
    "Werkzeug>=2.3.0",
    "flask-cors>=4.0.0",
    "flasgger>=0.9.7.1",
    "pillow>=9.0.0",
    "python-dateutil>=2.7.0",
    "packaging>=20.0",
    "monarch-py>=0.1.0",
]

[project.scripts]
schemalink = "schemalink_engine.cli:main"

[project.urls]
Homepage = "https://schemalink.anacleto.di.unimi.it"
Repository = "https://github.com/BioDataUniMI/schemalink-engine"
"Bug Tracker" = "https://github.com/BioDataUniMI/schemalink-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["schemalink_engine*"]

[tool.setuptools.package-data]
schemalink_engine = ["*.yaml", "*.json", "*.txt"]
